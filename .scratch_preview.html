<!DOCTYPE html>
<html lang="az">
<head>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">

<body>

  <section class="reels-section">

        <a class="reels-ig-badge" href="#" aria-label="Instagram-da bax">

          Layihələrimizdən qısa görüntülər, iş prosesimiz və son yeniliklər Instagram
          səhifəmizdə. Bizi izləyərək yeni layihələrdən ilk siz xəbərdar olun.

        <a href="#" class="btn btn-primary">
          Instagram-da İzləyin
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M1 7h12M8 2l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>

    </div>
